name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get llama.cpp
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
          cd app/src/main/cpp/llama.cpp
          git checkout $(git rev-list -n1 --before="2025-04-01" origin/HEAD)

      - name: Install NDK and CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GI-local-AI-apk-debug
          path: app/build/outputs/apk/debug/*.apk
