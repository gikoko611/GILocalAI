plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.gikoko.gilocalai'
    compileSdk 34
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'com.gikoko.gilocalai'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'armeabi-v7a' }   // add 'arm64-v8a' here for 64-bit phones
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_STL=c++_shared', '-DANDROID_ARM_NEON=ON' } }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
